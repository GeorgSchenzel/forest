[package]
name = "forest"
version = "0.1.0"
edition = "2024"
description = "Worktree & workforest manager"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
